server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirect client API calls directly to the isolated backend container network
    location /api/ {
        # ✅ THE ULTIMATE PROD FIX: Point this directly to your real backend URL subdomain service!
        proxy_pass https://onrender.com;
        
        proxy_set_header Host ://onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle CORS preflight options blocks seamlessly
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'X-Tenant-ID, Authorization, Content-Type' always;
            return 204;
        }
    }
}