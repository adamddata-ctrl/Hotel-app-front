server {
    listen 80;
    server_name localhost;

    # Serve Angular static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to your Render backend
    location /api/ {
        # ✅ CORRECT: Use your actual Render backend URL with https://
        proxy_pass https://hotel-app-back.onrender.com;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ✅ IMPORTANT: Forward the multi-tenant header
        proxy_set_header X-Tenant-ID $http_x_tenant_id;

        # ✅ SSL SETTINGS – Fixes the handshake error
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_server_name on;  # ✅ CRITICAL: Enables SNI support

        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}