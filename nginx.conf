server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; 
    }

    # 🛠️ FIXED PROXY ROUTING LAYER
    location /api/ {
        # 1. Routes directly to your actual backend service URL
        proxy_pass https://hotel-app-back.onrender.com; 
        
        # 2. Cleans up the host header domain string mapping
        proxy_set_header Host hotel-app-back.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep custom headers clean for your cross-origin multi-tenant data pipelines
        proxy_set_header X-Tenant-ID $http_x_tenant_id;

        # Handle CORS preflight options blocks seamlessly
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'X-Tenant-ID, Authorization, Content-Type' always;
            return 204;
        }
    }
}